<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeira Página</title>
  </head>

  <style>
    section {
      * {
        font-family: sans-serif;
        padding: 0;
        margin: 0;
      }

      header,
      footer,
      section,
      footer {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 5vh;
      }

      header {
        background: red;
        position: sticky;
        height: 10vh;
        top: 0;
      }

      section:nth-child(1) {
        height: 100vh;
        background: purple;
      }

      section:nth-child(2) {
        height: 100vh;
        background: orange;
      }

      section:nth-child(3) {
        height: 80vh;
      }

      footer {
        height: 10vh;
        background: black;
        color: white;
      }
    }
  </style>
  <body>
    <header>
      <p>menu</p>
    </header>

    <main>
      <section>
        <p>Hero Page</p>
      </section>

      <section>
        <p>os meus labs</p>
      </section>

      <section>
        <p>diw 🎉</p>
      </section>
    </main>

    <footer>
      <p>©</p>
    </footer>
  </body>
</html>
