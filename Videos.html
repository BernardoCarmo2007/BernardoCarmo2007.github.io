<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videotutoriais HTML & CSS</title>
    <style>
      body {
        font-family: sans-serif;
        background: #181818;
        color: #fff;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .grid-videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .video-card {
        background: #212121;
        padding: 15px;
        border-radius: 8px;
      }

      .video-card h3 {
        font-size: 16px;
        margin-top: 0;
        margin-bottom: 10px;
      }

      .video-container {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        border-radius: 6px;
      }

      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Os Meus 8 Videotutoriais</h1>

    <div class="grid-videos">
      <div class="video-card">
        <h3>1. Elementos Estruturais HTML5</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/IZq78ysCMxU"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>2. Tipos de Seletores</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/Q748BehYMAY"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>3. Composição de Seletores</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/IVPMBuRXFzQ"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>4. Box Model</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/MieNMpJxooI"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>5. Display Flex</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/t_DX8gLemyA"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>6. Display Grid</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/fIygSVSSp14"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>7. Media Queries</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/JbicZ9zZ9gs"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>8. Position</h3>
        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/hH4RQCfB45g"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
