<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Loja</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="filtros" style="margin: 20px; display: flex; gap: 15px">
        <input type="text" id="pesquisa" placeholder="Pesquisar produto..." />

        <select id="categoria">
          <option value="">Todas as categorias</option>
        </select>

        <select id="ordenacao">
          <option value="asc">Preço: Crescente</option>
          <option value="desc">Preço: Decrescente</option>
        </select>
      </section>

      <div class="layout">
        <section id="produtos"></section>

        <section class="cesto-section">
          <h2>O meu Cesto</h2>
          <div id="cesto"></div>

          <div
            id="checkout-area"
            style="
              margin-top: 20px;
              border-top: 1px solid #ccc;
              padding-top: 10px;
            "
          >
            <label><input type="checkbox" id="estudante" /> Sou estudante</label
            ><br /><br />
            <input
              type="text"
              id="cupao"
              placeholder="Cupão de desconto"
              style="margin-bottom: 10px; width: 100%"
            /><br />
            <button
              id="btn-comprar"
              style="
                background-color: #007bff;
                color: white;
                padding: 10px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                width: 100%;
              "
            >
              Comprar
            </button>
            <div id="checkout-resultado" style="margin-top: 15px"></div>
          </div>
        </section>
      </div>
    </main>

    <footer></footer>

    <script src="scripts.js"></script>
  </body>
</html>
